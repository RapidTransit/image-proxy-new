[versions]
vertx = "5.1.0"
jackson = "3.1.3"
logback = "1.5.32"
slf4j = "2.0.16"
netty = "4.1.115.Final"
junit = "6.1.0"
junitFallback = "5.11.4"
mockito = "5.23.0"
assertj = "3.26.3"
palantir = "2.50.0"
spotless = "7.0.0"
beryxJlink = "4.0.1"
pitest = "1.19.0"
pitestJunit5 = "1.2.3"

[libraries]
vertx-bom = { group = "io.vertx", name = "vertx-stack-depchain", version.ref = "vertx" }
vertx-web = { group = "io.vertx", name = "vertx-web" }
vertx-web-client = { group = "io.vertx", name = "vertx-web-client" }

netty-epoll = { group = "io.netty", name = "netty-transport-native-epoll", version.ref = "netty" }

jackson-databind = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
#jackson-jsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310", version.ref = "jackson" }

logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
vertx-junit5 = { group = "io.vertx", name = "vertx-junit5" }
mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-junit = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
assertj = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }

pitest-junit5-plugin = { group = "org.pitest", name = "pitest-junit5-plugin", version.ref = "pitestJunit5" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
beryx-jlink = { id = "org.beryx.jlink", version.ref = "beryxJlink" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest" }
