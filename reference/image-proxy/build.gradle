// https://stackoverflow.com/questions/39230739/how-to-configure-gradle-application-plugin-to-set-my-user-dir-to-the-location-of
// Gradle keeps adding double quotes ie: '"argshere"' for DEFAULT_JAVA_OPTS
startScripts {
  onlyIf { false }
  doLast {
    unixScript.text = unixScript.text.replace(/'"JVM_ARGS_PLACEHOLDER"'/, '"-Djava.awt.headless=true -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Dlog4j2.configurationFile=config/log4j2.xml"')
  }
}
