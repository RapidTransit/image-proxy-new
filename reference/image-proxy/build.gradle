  from 'config'
  into "$buildDir/distributions/image-proxy/config"
 // dependsOn createAppImage
}


/**
 * jlink fails if the output directory already exists, make sure it is deleted before
 */
def cleanJavaRuntime = tasks.register('cleanJavaRuntime') {
  project.delete("${buildDirectory}/distributions/java-runtime")
}

tasks.register('podmanJlink', Exec) {
  dependsOn tasks.named('checkPodmanExists')
  dependsOn cleanJavaRuntime
  commandLine "podman"
  args = [
          "run",
          "--mount=type=bind,source=${buildDirectory}/distributions,target=/output",
          "--rm",
          "docker.io/library/eclipse-temurin:24.0.1_9-jdk-ubi9-minimal",
          'jlink',
          "--no-header-files",
          "--no-man-pages",
          "--compress=2",
          "--strip-debug",
          "--add-modules", "java.base,jdk.unsupported,java.xml,java.management,java.logging,java.desktop,jdk.zipfs,jdk.crypto.ec,jdk.naming.dns,java.sql,java.naming",
          "--vm", "server",
          "--output", "/output/java-runtime"
  ]
}


tasks.register('listDeps') {

  group = groupName

  doLast {
    def toolchain = project.extensions.getByType(JavaPluginExtension.class).toolchain
    def launcher = javaToolchains.launcherFor(toolchain)
    def javaDir = launcher.map { it.metadata.installationPath }.get()
    def resolve = project.configurations.runtimeClasspath.resolve()
    def classPath = resolve.each {it.absolutePath}.join(",")
    resolve.each { f ->
      try {
        println "Report for: $f"
       def result = providers.exec {
          commandLine "${javaDir}/bin/jdeps", "--class-path", classPath, f.absolutePath
        }
        if(result.standardError){
          println result.standardError.asText.get()
        }
        if(result.standardOutput){
          println result.standardOutput.asText.get()
        }
      } catch (Throwable t) {
        t.printStackTrace()
      }
    }

  }
}

