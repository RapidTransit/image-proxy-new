tasks.withType(ShadowJar).configureEach {
  archiveClassifier.set('')
  exclude 'log4j2.xml'
  manifest {
    attributes(["Main-Verticle": mainVerticleName])
  }
  mergeServiceFiles()
}

distributions {
  shadow {
    contents {
      (from 'config') {
        exclude 'application-jwt.yaml'
        into 'config'
      }
      (from 'src/main/resources'){
        include 'log4j2.xml'
        into 'config'
      }
      (from 'build/distributions/java-runtime'){
        into 'java-runtime'
      }
     // exclude 'bin/**'
    }

    distributionBaseName.set(base.archivesName)
    println base.archivesName
  }
  main {
    contents {
      (from 'config') {
        exclude 'application-jwt.yaml'
        into 'config'
      }
      (from 'src/main/resources'){
        include 'log4j2.xml'
        into 'config'
      }
      exclude 'bin/**'
    }
  }
}

project.configurations.runtimeClasspath.setCanBeResolved(true)

// Exclude log4j2.xml from resources its going in config file
jar {
    def names = gradle.startParameter.taskNames
    if(names.contains('assembleDist') ||  names.contains("Dist")) {
      processResources.exclude('*')
    }
  doFirst {
    manifest {
      attributes([
              'Class-Path': project.configurations.runtimeClasspath.resolve().collect { it.name }.join(" "),
              'Main-Class': mainVerticleName
      ])
    }
  }
  dependsOn ('dependencies')
}


tasks.withType(Test).configureEach {
  useJUnitPlatform()
}

["skopeo", "podman"].forEach { executable ->
  tasks.register("check${executable.capitalize()}Exists", Exec) {
    logger.lifecycle("Checking if ${executable} is installed")
    group = 'verification'
    commandLine 'sh', '-c', "command -v ${executable} >/dev/null 2>&1 && echo \"${executable} is installed\" || { echo \"${executable} is not installed. Aborting.\" >&2; exit 1; }"

  }
}


tasks.withType(JavaExec).configureEach {
  args = ["run", mainVerticleName, "--redeploy=$watchForChange", "--launcher-class=$launcherClassName",
          "--on-redeploy=$doOnChange", "--java-opts", "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=8000"]
}



